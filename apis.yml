description: 'Simple Love (简爱酸奶) is a Chinese natural yogurt brand operated by Pucheng
  Dairy (Group) Co., Ltd. (朴诚乳业), founded in 2016. Known for zero-additive, low-temperature
  fresh yogurts with short ingredient lists — including its no-sugar, probiotic, high-protein,
  and coconut lines — the brand is distributed across supermarket shelves in every Chinese
  province and operates its own manufacturing capacity in Hebei. Surfaced as a portfolio
  company of Hongshan and added to the API Evangelist network as a stub. As a consumer
  packaged-goods (CPG) dairy company it publishes a corporate/consumer website but no
  public developer, API, or programmatic surface.'
